# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/dodopayments/dodopayments-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.' or 'packages/mcp-server'
        required: true

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC) — the token-exchange identity.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1, but Node 20 ships
      # npm 10.x. Pin 11.6.2 for reproducible runs (11.5.2 fixed an OIDC/
      # provenance ordering bug; 11.6.2 resolves trusted-publishing failures
      # seen in the wild).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="[\"$INPUT_PATH\"]"
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          yarn tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        # No NPM_TOKEN: npm Trusted Publishing (OIDC) authenticates the publish
        # via the job's id-token: write. bin/publish-npm skips wiring a static
        # _authToken when NPM_TOKEN is unset and calls `npm publish`, which
        # performs the OIDC token exchange. Each package (dodopayments,
        # dodopayments-mcp) has a trusted publisher on npmjs.com for repo
        # dodopayments/dodopayments-typescript + workflow publish-npm.yml.
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}

      - name: Upload MCP Server DXT GitHub release asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            packages/mcp-server/dodopayments_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
