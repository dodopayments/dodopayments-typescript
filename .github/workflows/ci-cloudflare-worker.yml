name: CI Cloudflare Worker

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
    paths:
      - 'packages/mcp-server/**'
      - '.github/workflows/ci-cloudflare-worker.yml'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
    paths:
      - 'packages/mcp-server/**'
      - '.github/workflows/ci-cloudflare-worker.yml'

jobs:
  worker:
    timeout-minutes: 20
    name: typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server/cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate the locked production packages
        run: |
          npm run typecheck
          npm test
          npx --no-install wrangler deploy --dry-run

      # Also validate this commit, so a change to `packages/mcp-server/src` that breaks
      # the Worker surfaces here, not only after the next release is pinned.
      # `src/execute-tool.ts` imports `dodopayments-mcp/code-tool` directly, so that is a
      # real exposure rather than a theoretical one.
      - name: Build the packages from this commit
        working-directory: ${{ github.workspace }}
        run: |
          yarn install --frozen-lockfile
          ./scripts/build

      # `patch-deps.js` rewrites files inside the installed package, so it has to run again
      # against the build that just replaced it.
      - name: Validate against the local build instead of the published packages
        run: |
          rm -rf node_modules/dodopayments node_modules/dodopayments-mcp
          cp -R "$GITHUB_WORKSPACE/dist" node_modules/dodopayments
          cp -R "$GITHUB_WORKSPACE/packages/mcp-server/dist" node_modules/dodopayments-mcp
          node scripts/patch-deps.js

      - name: Build isolate bundle
        run: npm run build:isolate

      - name: Check types
        run: npm run typecheck

      - name: Test OAuth migration
        run: npm test

      - name: Validate worker build
        run: npx --no-install wrangler deploy --dry-run
