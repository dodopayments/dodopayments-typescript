version: 2
updates:
  # Keep GitHub Actions pinned versions current. Grouped into a single weekly PR
  # so a fleet-wide action bump is one review, not one per action.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5

  # packages/mcp-server depends on `dodopayments` via `link:../../dist/`, which exists
  # only after a build, so file fetching failed with "path based dependencies could not
  # be retrieved". `ignore` applies to security updates too and makes the fetcher skip
  # that path dependency (`exclude-paths` cannot point outside the directory).
  # Version update PRs stay off (limit 0); security updates are unaffected by the limit.
  - package-ecosystem: 'npm'
    directory: '/packages/mcp-server'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'dodopayments'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'

  # The production MCP Worker installs from its package-lock.json with `npm ci`.
  # Keep the exact @modelcontextprotocol/sdk pin and its overrides blocks in sync
  # by hand when reviewing these PRs (see package.json). Worker deploys run on
  # release, so a merged bump ships with the next release.
  - package-ecosystem: 'npm'
    directory: '/packages/mcp-server/cloudflare-worker'
    schedule:
      interval: 'weekly'
    groups:
      dodopayments:
        patterns:
          - 'dodopayments'
          - 'dodopayments-mcp'
      worker:
        patterns:
          - '*'
        exclude-patterns:
          - 'dodopayments'
          - 'dodopayments-mcp'
    labels:
      - 'dependencies'
    # Security updates only: the worker is sealed custom code in
    # dodopayments-sdk-config, so every merged bump needs a manual re-seal.
    open-pull-requests-limit: 0
